topic:
  name: Email Infrastructure Research
  short: email
  description: Email protocols and servers, mailbox migration, email security standards, anti-spam/anti-phishing,
    and AI-assisted email.
  openalex_mailto: tobias@tobias-weiss.org
taxonomy:
  categories:
  - id: protocols
    display: Protocols & Interop
    description: IMAP, JMAP, SMTP, POP3, Exchange/EWS and email protocol evolution
  - id: mail-servers
    display: Mail Servers & Storage
    description: Server implementations, mailbox storage, threading, LDAP/OIDC integration
  - id: delivery-security
    display: Delivery Security
    description: DMARC, DKIM, SPF, BIMI, TLS/STARTTLS, MTA-STS and authentication standards
  - id: spam-phishing
    display: Spam & Phishing
    description: Spam filtering, phishing detection, sender reputation and abuse frameworks
  - id: mailbox-migration
    display: Mailbox Migration
    description: Migration tooling, sync, coexistence, EAS bridging and cutover strategies
  - id: ai-email
    display: AI-Assisted Email
    description: Email classification, triage, summarization, drafting and AI agents in mail
  - id: privacy-compliance
    display: Privacy & Compliance
    description: Encryption (PGP/S/MIME), data protection, e-discovery and retention
  - id: surveys
    display: Surveys
    description: Reviews and systematic studies of email infrastructure research
  subcategories:
  - id: imap
    category: protocols
    display: IMAP & JMAP
    description: IMAP4, JMAP, synchronization and mailbox access protocols
  - id: smtp
    category: protocols
    display: SMTP & Delivery
    description: SMTP, message routing, queueing and delivery infrastructure
  - id: exchange
    category: protocols
    display: Exchange & EAS
    description: Exchange Web Services, ActiveSync and legacy protocol bridging
  - id: server-impl
    category: mail-servers
    display: Server Implementations
    description: Dovecot, Postfix, Stalwart and other server designs
  - id: storage-format
    category: mail-servers
    display: Storage & Indexing
    description: Maildir/mbox, index formats, search and database-backed storage
  - id: identity
    category: mail-servers
    display: Identity & Auth
    description: LDAP, OIDC, SASL and mailbox authentication and authorization
  - id: dmarc-dkim
    category: delivery-security
    display: DMARC/DKIM/SPF
    description: Domain authentication standards and alignment
  - id: bimi-branding
    category: delivery-security
    display: BIMI & Branding
    description: Brand Indicators for Message Identification and logo verification
  - id: transport-security
    category: delivery-security
    display: Transport Security
    description: STARTTLS, MTA-STS, DANE and opportunistic TLS hardening
  - id: spam-filtering
    category: spam-phishing
    display: Spam Filtering
    description: Bayesian, ML and rule-based spam classification
  - id: phishing-detection
    category: spam-phishing
    display: Phishing Detection
    description: Detecting phishing, spoofing and malicious payloads
  - id: reputation
    category: spam-phishing
    display: Reputation & Feedback
    description: Sender reputation, feedback loops, blocklists and SRS
  - id: migration-tools
    category: mailbox-migration
    display: Migration Tooling
    description: Imapsync-style tools, delta sync and batch migration
  - id: coexistence
    category: mailbox-migration
    display: Coexistence & Cutover
    description: Hybrid deployments, parallel operation and cutover risk
  - id: classification
    category: ai-email
    display: Email Classification
    description: Triage, routing and intent classification of email
  - id: summarization
    category: ai-email
    display: Summarization & Drafting
    description: LLM-based summaries, replies and drafting assistance
  - id: agents
    category: ai-email
    display: Email Agents
    description: Autonomous agents acting on mailboxes and task extraction
  - id: encryption
    category: privacy-compliance
    display: Email Encryption
    description: PGP, S/MIME, end-to-end and at-rest encryption
  - id: data-protection
    category: privacy-compliance
    display: Data Protection
    description: GDPR, retention, e-discovery and lawful access
  - id: survey
    category: surveys
    display: Surveys
    description: Systematic reviews and research surveys
arxiv_queries:
- query: cat:cs.CR AND (abs:"email security" OR abs:"email infrastructure" OR abs:"email system")
  category: delivery-security
- query: cat:cs.CR AND (abs:"DMARC" OR abs:"DKIM" OR abs:"SPF" OR abs:"email authentication" OR abs:"email spoofing")
  category: delivery-security
- query: cat:cs.CR AND (abs:"phishing" OR abs:"phish")
  category: spam-phishing
- query: cat:cs.CR AND (abs:"spam detection" OR abs:"spam filtering" OR abs:"spam classification")
  category: spam-phishing
- query: cat:cs.CR AND (abs:"sender reputation" OR abs:"email reputation" OR abs:"open relay")
  category: spam-phishing
- query: cat:cs.NI AND (abs:"email protocol" OR abs:"IMAP" OR abs:"JMAP")
  category: protocols
- query: cat:cs.NI AND (abs:"SMTP" OR abs:"mail transfer")
  category: protocols
- query: cat:cs.CR AND (abs:"STARTTLS" OR abs:"MTA-STS" OR abs:"DANE" OR abs:"transport security" AND abs:"email")
  category: delivery-security
- query: cat:cs.LG AND (abs:"email classification" OR abs:"email triage" OR abs:"email intent")
  category: ai-email
- query: cat:cs.CL AND (abs:"email summarization" OR abs:"email generation" OR abs:"email drafting")
  category: ai-email
- query: cat:cs.LG AND (abs:"spam" AND abs:"machine learning")
  category: spam-phishing
- query: cat:cs.CY AND (abs:"email privacy" OR abs:"email encryption" OR abs:"PGP")
  category: privacy-compliance
- query: cat:cs.CY AND (abs:"email" AND abs:"phishing awareness")
  category: spam-phishing
- query: cat:cs.SE AND (abs:"mail server" OR abs:"email server")
  category: mail-servers
- query: cat:cs.CR AND (abs:"BIMI" OR abs:"brand indicators for message identification")
  category: delivery-security
- query: cat:cs.NI AND (abs:"spoofing" OR abs:"spear phishing" OR abs:"business email compromise")
  category: spam-phishing
- query: cat:cs.LG AND (abs:"email" AND (abs:"anomaly detection" OR abs:"outlier"))
  category: ai-email
- query: cat:cs.CY AND (abs:"e-discovery" OR abs:"email retention" OR abs:"mailbox forensics")
  category: privacy-compliance
- query: cat:cs.AI AND (abs:"email" AND (abs:"agent" OR abs:"automation"))
  category: ai-email
- query: cat:cs.DC AND (abs:"mailbox migration" OR abs:"email migration")
  category: mailbox-migration
